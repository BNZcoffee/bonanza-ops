<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보난자커피 — 운영 매뉴얼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--br:#3B2314;--brm:#6B3E2A;--brl:#A0622A;--cr:#F9F4EE;--crm:#EDE4D6;--crd:#D9C9B3;--gd:#C8963C;--gdl:#E8C07A;--tm:#2A1A0E;--ts:#7A5C44;--th:#B09070;--gn:#2D6A4F;--gnb:#EAF4EE;--rd:#A0291E;--rdb:#FAF0EE;--bl:#1A4B7A;--blb:#EAF0FA}
body{font-family:'Segoe UI',-apple-system,system-ui,sans-serif;background:var(--cr);color:var(--tm);line-height:1.7;font-size:15px}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 80px}
.cover{text-align:center;padding:50px 20px 36px;background:linear-gradient(160deg,#3B2314,#6B3E2A);color:#fff;border-radius:0 0 28px 28px;margin-bottom:18px}
.cover .brand{font-size:12px;letter-spacing:4px;text-transform:uppercase;opacity:.85;margin-bottom:16px}
.cover h1{font-size:28px;font-weight:600;margin-bottom:8px}
.cover .sub{font-size:14px;opacity:.85;margin-bottom:18px}
.cover .ver{display:inline-block;background:rgba(255,255,255,.15);border-radius:20px;padding:6px 16px;font-size:13px}
/* LOGIN */
#loginBox{max-width:360px;margin:40px auto;background:#fff;border:0.5px solid var(--crd);border-radius:16px;padding:32px}
#loginBox h2{font-size:16px;color:var(--br);margin-bottom:6px;text-align:center}
#loginBox p{font-size:13px;color:var(--th);text-align:center;margin-bottom:20px}
#loginBox input{width:100%;border:0.5px solid var(--crd);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;background:var(--cr)}
#loginBox input:focus{border-color:var(--brl)}
#loginBox button{width:100%;background:var(--br);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
#loginErr{color:var(--rd);font-size:12px;margin-top:8px;min-height:16px;text-align:center}
/* TABS */
.tabbar{position:sticky;top:0;z-index:50;background:var(--cr);display:flex;gap:8px;padding:14px 0;border-bottom:1px solid var(--crd);margin-bottom:8px;flex-wrap:wrap}
.tab{border:1px solid var(--crd);background:#fff;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;color:var(--ts);cursor:pointer}
.tab.active{background:var(--br);color:#fff;border-color:var(--br)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--ts)}
.logout{background:none;border:0.5px solid var(--crd);border-radius:7px;padding:5px 12px;font-size:12px;color:var(--ts);cursor:pointer}
h2.sec{font-size:20px;font-weight:600;color:var(--br);margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--gd);scroll-margin-top:70px}
/* 목차 토글 */
.toc{background:var(--crm);border:1px solid var(--crd);border-radius:12px;margin:14px 0;overflow:hidden}
.toc-head{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;font-family:inherit}
.toc-title{font-size:12px;font-weight:700;color:var(--brm);letter-spacing:1px;text-transform:uppercase}
.toc-body{display:none;padding:0 18px 14px}
.toc a{display:block;padding:6px 0;color:var(--brm);text-decoration:none;font-size:14px;border-bottom:1px solid var(--crd);cursor:pointer}
.toc a:last-child{border-bottom:none}
.toc a:hover{color:var(--br);font-weight:600}
.toc-chev{font-size:16px;color:var(--th);transition:transform .2s}
/* 섹션 아코디언 */
.acc{background:#fff;border:1px solid var(--crd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc-head{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;font-family:inherit}
.acc-title{font-size:16px;font-weight:600;color:var(--br)}
.acc-chev{font-size:18px;color:var(--th);transition:transform .2s}
.acc-body{display:none;padding:0 18px 18px}
.mbody{font-size:14px;line-height:1.8;color:var(--tm)}
.mbody ul{margin:8px 0 12px 22px}
.mbody b{color:var(--brm)}
.figure{margin:16px 0;padding:14px;background:#fff;border:1px solid var(--crd);border-radius:14px}
.figure svg{width:100%;height:auto;display:block;border-radius:8px}
.figcap{font-size:12px;color:var(--th);text-align:center;margin-top:8px;font-style:italic}
.updated{background:var(--gnb);border:0.5px solid var(--gn);border-radius:10px;padding:11px 14px;font-size:13px;color:#1d4d38;margin-bottom:16px}
.foot{text-align:center;color:var(--th);font-size:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--crd)}
.loading{text-align:center;padding:40px;color:var(--th)}
@media(max-width:600px){.cover h1{font-size:23px}.tab{padding:9px 13px;font-size:13px}}
</style>
</head>
<body>
<div class="cover">
  <div class="brand">Bonanza Coffee Korea</div>
  <h1>운영 매뉴얼</h1>
  <div class="sub">사용 설명서 · 화면 예시 포함</div>
  <div class="ver" id="verBadge">로그인 후 이용</div>
</div>
<div class="wrap">
  <div id="loginBox">
    <h2>운영 매뉴얼 열람</h2>
    <p>이름과 비밀번호로 로그인해주세요.<br>계정 정보는 매니저·운영팀에 문의하세요.</p>
    <input type="text" id="name" placeholder="이름 (예: 홍길동)" autocomplete="off"/>
    <input type="password" id="pw" placeholder="비밀번호"/>
    <button onclick="doLogin()">로그인</button>
    <div id="loginErr"></div>
  </div>
  <div id="content" style="display:none"></div>
</div>
<script>
const SUPABASE_URL='https://fhwiihbtlspeckmgnlax.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZod2lpaGJ0bHNwZWNrbWdubGF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MzQxMjcsImV4cCI6MjA5NjMxMDEyN30.izRHlmKaKLBSY78eSNMpyt-mGw0Whlt6XIAoNjp5Aqo';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const IMG_MAP={"로그인하기": "<svg width=\"600\" height=\"420\" viewBox=\"0 0 600 420\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR, sans-serif\">\n   <rect width=\"600\" height=\"420\" fill=\"#F9F4EE\"/>\n   <!-- login card -->\n   <rect x=\"150\" y=\"50\" width=\"300\" height=\"320\" rx=\"16\" fill=\"#ffffff\" stroke=\"#D9C9B3\" stroke-width=\"1\"/>\n   <text x=\"300\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" letter-spacing=\"3\" font-weight=\"700\" fill=\"#3B2314\">BONANZA COFFEE KOREA</text>\n   <text x=\"300\" y=\"128\" text-anchor=\"middle\" font-size=\"12\" fill=\"#B09070\">운영 매뉴얼 시스템</text>\n   <!-- input 1 -->\n   <rect x=\"180\" y=\"155\" width=\"240\" height=\"40\" rx=\"8\" fill=\"#F9F4EE\" stroke=\"#D9C9B3\" stroke-width=\"1\"/>\n   <text x=\"195\" y=\"180\" font-size=\"13\" fill=\"#7A5C44\">이름 (예: 홍길동)</text>\n   <!-- input 2 -->\n   <rect x=\"180\" y=\"205\" width=\"240\" height=\"40\" rx=\"8\" fill=\"#F9F4EE\" stroke=\"#D9C9B3\" stroke-width=\"1\"/>\n   <text x=\"195\" y=\"230\" font-size=\"13\" fill=\"#B09070\">비밀번호</text>\n   <!-- checkbox -->\n   <rect x=\"180\" y=\"258\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#fff\" stroke=\"#A0622A\" stroke-width=\"1.2\"/>\n   <text x=\"202\" y=\"270\" font-size=\"12\" fill=\"#7A5C44\">자동 로그인</text>\n   <!-- button -->\n   <rect x=\"180\" y=\"288\" width=\"240\" height=\"44\" rx=\"8\" fill=\"#3B2314\"/>\n   <text x=\"300\" y=\"316\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#ffffff\">로그인</text>\n</svg>", "공지 열람과 확인 처리": "<svg width=\"640\" height=\"380\" viewBox=\"0 0 640 380\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR, sans-serif\">\n<rect width=\"640\" height=\"380\" fill=\"#F9F4EE\"/>\n<rect x=\"40\" y=\"20\" width=\"560\" height=\"340\" rx=\"12\" fill=\"#fff\" stroke=\"#D9C9B3\"/>\n<text x=\"64\" y=\"56\" font-size=\"16\" font-weight=\"500\" fill=\"#2A1A0E\">동절기 매장 운영시간 변경 안내</text>\n<line x1=\"64\" y1=\"72\" x2=\"576\" y2=\"72\" stroke=\"#EDE4D6\"/>\n<text x=\"64\" y=\"92\" font-size=\"11\" fill=\"#B09070\">2026-06-09     운영 공지     열람: 전 직원</text>\n<rect x=\"430\" y=\"80\" width=\"60\" height=\"20\" rx=\"6\" fill=\"#F9F4EE\" stroke=\"#D9C9B3\"/><text x=\"460\" y=\"94\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7A5C44\">저장</text>\n<rect x=\"500\" y=\"80\" width=\"76\" height=\"20\" rx=\"6\" fill=\"#F9F4EE\" stroke=\"#D9C9B3\"/><text x=\"538\" y=\"94\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7A5C44\">링크 공유</text>\n<!-- 본문 -->\n<text x=\"64\" y=\"125\" font-size=\"12\" fill=\"#2A1A0E\">12월 1일부터 전 매장 영업시간이 아래와 같이 변경됩니다.</text>\n<text x=\"64\" y=\"148\" font-size=\"12\" fill=\"#2A1A0E\">- 평일: 08:00 ~ 21:00</text>\n<text x=\"64\" y=\"168\" font-size=\"12\" fill=\"#2A1A0E\">- 주말: 09:00 ~ 22:00</text>\n<text x=\"64\" y=\"191\" font-size=\"12\" fill=\"#2A1A0E\">매장별 마감 점검 사항은 첨부파일을 확인해주세요.</text>\n<text x=\"320\" y=\"160\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#3B2314\" opacity=\"0.06\" transform=\"rotate(-20 320 160)\">BCK-001 이선우 운영팀</text>\n<!-- 첨부파일 -->\n<text x=\"64\" y=\"225\" font-size=\"10\" font-weight=\"700\" fill=\"#B09070\" letter-spacing=\"1\">첨부파일</text>\n<rect x=\"64\" y=\"234\" width=\"300\" height=\"36\" rx=\"8\" fill=\"#fff\" stroke=\"#D9C9B3\"/>\n<text x=\"80\" y=\"256\" font-size=\"12\" fill=\"#1A4B7A\">마감점검_체크리스트.pdf</text>\n<rect x=\"300\" y=\"244\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#EAF0FA\"/><text x=\"312\" y=\"257\" text-anchor=\"middle\" font-size=\"8\" font-weight=\"700\" fill=\"#1A4B7A\">PDF</text>\n<rect x=\"326\" y=\"244\" width=\"26\" height=\"16\" rx=\"4\" fill=\"#F9F4EE\"/><text x=\"339\" y=\"256\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#7A5C44\">보기</text>\n<rect x=\"356\" y=\"244\" width=\"26\" height=\"16\" rx=\"4\" fill=\"#F9F4EE\"/><text x=\"369\" y=\"256\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1A4B7A\">저장</text>\n<!-- 확인 버튼 -->\n<line x1=\"64\" y1=\"292\" x2=\"576\" y2=\"292\" stroke=\"#EDE4D6\"/>\n<rect x=\"64\" y=\"308\" width=\"150\" height=\"40\" rx=\"8\" fill=\"#2D6A4F\"/><text x=\"139\" y=\"333\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">확인했습니다</text>\n</svg>"};

let me=null;
let curAud='user';
let cachedQuickStartHtml = ''; 

function userGrade(u){
  if(!u) return 'staff';
  if(u.is_master) return 'master';
  if(u.is_vice_master || u.role==='ceo' || u.role==='executive_director') return 'sub_master';
  if(u.part || u.role==='dept' || u.role==='admin') return 'dept';
  if(u.role==='manager' || (u.role && u.role.indexOf('manager')===0)) return 'manager';
  return 'staff';
}
function availAuds(u){
  const g=userGrade(u);
  return [
    ['user','팀원(매장)용'],
    ['manager','매니저용'],
    ['dept','부서담당용'],
    ['admin','총괄·부총괄용']
  ].filter(([a])=>{
    if(a==='user') return true;
    if(a==='manager') return ['manager','dept','sub_master','master'].includes(g);
    if(a==='dept') return ['dept','sub_master','master'].includes(g);
    if(a==='admin') return ['sub_master','master'].includes(g);
    return false;
  });
}

async function doLogin(){
  const name=document.getElementById('name').value.trim();
  const pw=document.getElementById('pw').value.trim();
  const err=document.getElementById('loginErr');
  if(!name){ err.textContent='이름을 입력해주세요.'; return; }
  if(!pw){ err.textContent='비밀번호를 입력해주세요.'; return; }
  err.textContent='확인 중...';
  
  const {data:rows,error}=await sb.from('users').select('*')
    .eq('name',name).eq('password_hash',pw).eq('active',true);
  if(error||!rows||rows.length===0){
    err.textContent='이름 또는 비밀번호를 확인해주세요. (활성 계정만 로그인 가능)';
    return;
  }
  const data=rows[0];
  const today=new Date().toISOString().slice(0,10);
  if(data.retire_date && data.retire_date<today){
    err.textContent='퇴사 처리된 계정입니다. 운영팀에 문의해주세요.';
    await sb.from('users').update({active:false}).eq('id',data.id);
    return;
  }
  me=data;
  document.getElementById('loginBox').style.display='none';
  document.getElementById('content').style.display='block';
  
  // 💡 [확인 완료] 로그인하자마자 데이터베이스 가이드 동기화
  try {
    const { data: config, error: configErr } = await sb
      .from('app_configs')
      .select('value')
      .eq('key', 'quick_start_guide')
      .maybeSingle();
    if (!configErr && config) {
      cachedQuickStartHtml = config.value;
    }
  } catch (err) {
    console.error("가이드 가져오기 실패:", err.message);
  }

  const auds=availAuds(me);
  curAud=auds[0][0];
  render();
}

const MANUAL_BUILD_DATE='2026-07-17';

function quickStartHTML(){
  return cachedQuickStartHtml || `
    <div style="background:#fff; border:1px solid #2D6A4F; border-left:4px solid #2D6A4F; border-radius:10px; padding:16px 18px; margin-bottom:16px">
      <div style="font-size:15px; font-weight:700; color:#1d4d38; margin-bottom:4px">🚀 신규 입사자 빠른 시작 가이드</div>
      <div style="font-size:12px; color:#8a7a68; margin-bottom:10px">가이드를 안전하게 불러오고 있습니다...</div>
    </div>
  `;
}

async function render(){
  const c=document.getElementById('content');
  c.innerHTML='<div class="loading"><i class="ti ti-loader"></i> 불러오는 중...</div>';
  
  // 💡 한 번 더 데이터 호출 상태 보장
  if(!cachedQuickStartHtml){
    try {
      const { data: config } = await sb.from('app_configs').select('value').eq('key', 'quick_start_guide').maybeSingle();
      if (config) {
        cachedQuickStartHtml = config.value;
      }
    } catch (e){}
  }

  const auds=availAuds(me);
  if(!auds.find(([a])=>a===curAud)) curAud=auds[0][0];
  const {data:secs}=await sb.from('manual_sections').select('*').eq('audience',curAud).order('sort_order');
  
  let updated = MANUAL_BUILD_DATE;
  try {
    const {data:allMeta}=await sb.from('manual_sections').select('updated_at');
    const times=(allMeta||[]).map(s=>s.updated_at).filter(Boolean).map(t=>t.slice(0,10)).sort();
    if(times.length && times[times.length-1] > updated) updated = times[times.length-1];
  } catch(e){}
  document.getElementById('verBadge').textContent = '업데이트: '+updated;

  const tabBar=auds.length>1?`<div class="tabbar">${auds.map(([a,l])=>`<button class="tab${curAud===a?' active':''}" onclick="curAud='${a}';render()">${l}</button>`).join('')}</div>`:'';
  const topbar=`<div class="topbar"><span><b>${me.name}</b> · ${me.store||''} · ${gradeLabel(userGrade(me))}</span><button class="logout" onclick="logout()">로그아웃</button></div>`;

  let body='';
  if(!secs||!secs.length){
    body='<div class="loading">등록된 내용이 없습니다.</div>';
  }else{
    const toc=secs.map((s,i)=>`<a onclick="openSec(${i})">${s.title}</a>`).join('');
    const sections=secs.map((s,i)=>{
      const img=IMG_MAP[s.title];
      const figure=img?`<div class="figure">${img}<div class="figcap">${s.title} — 화면 예시</div></div>`:'';
      return `<div class="acc" id="s${i}">
        <button class="acc-head" onclick="toggleSec(${i})"><span class="acc-title">${s.title}</span><i class="ti ti-chevron-down acc-chev" id="chev${i}"></i></button>
        <div class="acc-body" id="body${i}"><div class="mbody">${s.body||''}</div>${figure}</div>
      </div>`;
    }).join('');
    body=`<div class="toc">
      <button class="toc-head" onclick="toggleToc()"><span class="toc-title">📑 목차</span><i class="ti ti-chevron-down toc-chev" id="tocChev"></i></button>
      <div class="toc-body" id="tocBody">${toc}</div>
    </div>${sections}`;
  }
  
  // 💡 [관리자용 에디터 완전히 삭제] 순수 가이드북과 설명서만 노출합니다.
  c.innerHTML = topbar + tabBar + 
                `<div class="updated">이 설명서는 앱의 사용 설명서와 항상 같은 내용입니다. 여기에는 화면 예시 그림이 함께 표시됩니다.</div>` + 
                quickStartHTML() + 
                body + 
                `<div class="foot">보난자커피 운영 매뉴얼 · 내부 자료</div>`;
}

function gradeLabel(g){return {master:'총괄',vice:'부총괄',dept:'부서담당',manager:'매니저',staff:'매장직원'}[g]||g;}
function toggleToc(){
  var b=document.getElementById('tocBody'), c=document.getElementById('tocChev');
  if(!b)return; var open=b.style.display!=='none';
  b.style.display=open?'none':'block'; if(c)c.style.transform=open?'rotate(0deg)':'rotate(180deg)';
}
function toggleSec(i){
  var b=document.getElementById('body'+i), c=document.getElementById('chev'+i);
  if(!b)return; var open=b.style.display!=='none';
  b.style.display=open?'none':'block'; if(c)c.style.transform=open?'rotate(0deg)':'rotate(180deg)';
}
function openSec(i){
  var b=document.getElementById('body'+i), c=document.getElementById('chev'+i);
  if(b&&b.style.display==='none'){ b.style.display='block'; if(c)c.style.transform='rotate(180deg)'; }
  var s=document.getElementById('s'+i); if(s)s.scrollIntoView({behavior:'smooth',block:'start'});
}
function logout(){ me=null; document.getElementById('content').style.display='none'; document.getElementById('loginBox').style.display='block'; document.getElementById('name').value=''; document.getElementById('pw').value=''; document.getElementById('loginErr').textContent=''; document.getElementById('verBadge').textContent='로그인 후 이용'; }

document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&document.getElementById('loginBox').style.display!=='none') doLogin(); });
</script>
</body>
</html>
