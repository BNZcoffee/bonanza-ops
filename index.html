<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보난자 커피 — 운영 매뉴얼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --br:#3B2314;--brm:#6B3E2A;--brl:#A0622A;
  --cr:#F9F4EE;--crm:#EDE4D6;--crd:#D9C9B3;
  --gd:#C8963C;--gdl:#E8C07A;
  --tm:#2A1A0E;--ts:#7A5C44;--th:#B09070;
  --gn:#2D6A4F;--gnb:#EAF4EE;
  --rd:#A0291E;--rdb:#FAF0EE;
  --bl:#1A4B7A;--blb:#EAF0FA;
  --pu:#534AB7;--pub:#EEEDFE;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--cr);color:var(--tm);min-height:100vh}
#app{display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--br);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px;position:sticky;top:0;z-index:100;display:none}
.logo{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-badge{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.role-tag{font-size:10px;background:var(--gd);color:var(--br);border-radius:10px;padding:2px 7px;font-weight:700}
.topbar-btn{background:none;border:0.5px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px}
.topbar-btn:hover{opacity:.8}
.notif-dot{width:7px;height:7px;background:#E8C07A;border-radius:50%;display:none}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;flex:1;background:var(--cr)}
.login-card{background:#fff;border:0.5px solid var(--crd);border-radius:16px;padding:40px;width:360px;text-align:center}
.login-logo{font-size:11px;letter-spacing:3px;font-weight:700;color:var(--br);text-transform:uppercase;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--th);margin-bottom:26px}
.login-card input[type=text],.login-card input[type=password]{width:100%;border:0.5px solid var(--crd);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--tm);background:var(--cr);margin-bottom:10px;outline:none;font-family:inherit}
.login-card input:focus{border-color:var(--brl)}
.btn-login{width:100%;background:var(--br);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-login:hover{background:var(--brm)}
.login-err{color:var(--rd);font-size:12px;margin-top:8px;min-height:18px}
.autologin-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ts);margin-top:8px;justify-content:center;cursor:pointer}

/* MAIN */
#mainScreen{display:none;flex:1;flex-direction:row}
.sidebar{width:210px;background:#fff;border-right:0.5px solid var(--crd);display:flex;flex-direction:column;padding:14px 0;flex-shrink:0;min-height:calc(100vh - 50px)}
.sidebar-section{padding:0 10px;margin-bottom:6px}
.sidebar-label{font-size:10px;font-weight:700;color:var(--th);letter-spacing:2px;text-transform:uppercase;padding:4px 8px 5px}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;text-align:left;padding:7px 8px;border-radius:8px;font-size:13px;color:var(--ts);cursor:pointer;position:relative}
.nav-btn:hover{background:var(--cr)}
.nav-btn.active{background:var(--crm);color:var(--br);font-weight:600}
.nav-btn i{font-size:15px;width:18px;text-align:center}
.nav-new{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--gd);color:var(--br);font-size:9px;font-weight:700;border-radius:10px;padding:2px 5px}
.sidebar-footer{margin-top:auto;padding:10px 14px;border-top:0.5px solid var(--crd);font-size:11px;color:var(--th)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:22px;background:var(--cr)}
.page-header{margin-bottom:18px}
.page-title{font-size:18px;font-weight:500;color:var(--tm)}
.page-sub{font-size:13px;color:var(--ts);margin-top:3px}

/* BOARD */
.board-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tab-btn{background:none;border:0.5px solid var(--crd);border-radius:8px;padding:6px 13px;font-size:12px;color:var(--ts);cursor:pointer}
.tab-btn.active{background:var(--br);color:#fff;border-color:var(--br)}
.tab-btn:hover:not(.active){background:var(--crm)}
.tab-manage{background:none;border:none;font-size:11px;color:var(--th);cursor:pointer;padding:6px 8px;text-decoration:underline}
.board-toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:0.5px solid var(--crd);border-radius:8px;padding:8px 12px}
.search-box input{border:none;background:none;font-size:13px;color:var(--tm);flex:1;outline:none}
.btn-new{background:var(--br);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-new:hover{background:var(--brm)}
.post-list{display:flex;flex-direction:column;gap:8px}
.post-card{background:#fff;border:0.5px solid var(--crd);border-radius:12px;padding:14px 16px;cursor:pointer}
.post-card:hover{border-color:var(--brl)}
.post-card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.post-title-txt{font-size:14px;font-weight:500;color:var(--tm);flex:1}
.badge-new{background:var(--gdl);color:var(--br);font-size:9px;font-weight:700;border-radius:10px;padding:2px 6px;flex-shrink:0}
.badge-access{background:var(--blb);color:var(--bl);font-size:9px;font-weight:600;border-radius:10px;padding:2px 6px}
.badge-access.all{background:var(--gnb);color:var(--gn)}
.badge-comment{background:var(--pub);color:var(--pu);font-size:9px;font-weight:600;border-radius:10px;padding:2px 6px}
.post-meta{font-size:11px;color:var(--th);display:flex;gap:12px}
.read-rate{font-size:11px;color:var(--gn);font-weight:600}

/* POST DETAIL */
.post-detail{background:#fff;border:0.5px solid var(--crd);border-radius:12px;padding:22px}
.detail-header{margin-bottom:18px;padding-bottom:14px;border-bottom:0.5px solid var(--crd)}
.detail-title-row{font-size:17px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-meta{font-size:12px;color:var(--th);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wm-wrap{position:relative;user-select:none;-webkit-user-select:none}
.watermark{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:2;opacity:.055;font-size:13px;font-weight:700;color:var(--br);transform:rotate(-30deg);white-space:nowrap;letter-spacing:2px}
.detail-body{font-size:14px;line-height:1.8;color:var(--tm);margin-bottom:18px;position:relative;z-index:1;white-space:pre-wrap}
.attach-label{font-size:11px;font-weight:700;color:var(--th);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.attach-file{display:inline-flex;align-items:center;gap:5px;background:var(--cr);border:0.5px solid var(--crd);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--ts);cursor:pointer;margin:3px 3px 0 0;text-decoration:none}
.section-label{font-size:11px;font-weight:700;color:var(--th);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.confirm-section{border-top:0.5px solid var(--crd);padding-top:14px;margin-bottom:16px}
.btn-confirm{background:var(--gn);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-confirm.done{background:var(--gnb);color:var(--gn);cursor:default}
.confirm-time{font-size:11px;color:var(--gn);margin-top:5px}
.reach-bar{background:var(--cr);border-radius:10px;height:5px;margin:6px 0;overflow:hidden}
.reach-fill{background:var(--gn);height:100%;border-radius:10px}
.reach-label{font-size:11px;color:var(--ts);display:flex;justify-content:space-between}
.read-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--crd);font-size:12px}
.read-row:last-child{border-bottom:none}
.unread-badge{background:var(--rdb);color:var(--rd);font-size:9px;border-radius:10px;padding:2px 6px;font-weight:700}

/* COMMENTS */
.comment-section{border-top:0.5px solid var(--crd);padding-top:16px;margin-top:4px}
.comment-item{padding:10px 0;border-bottom:0.5px solid var(--crd)}
.comment-item:last-child{border-bottom:none}
.comment-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--crm);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--br);flex-shrink:0}
.comment-body{font-size:13px;color:var(--tm);line-height:1.6;padding-left:36px}
.comment-input-row{display:flex;gap:8px;margin-top:14px;align-items:flex-start}
.comment-input-row textarea{flex:1;border:0.5px solid var(--crd);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--tm);background:var(--cr);outline:none;resize:none;font-family:inherit;min-height:60px}
.comment-input-row textarea:focus{border-color:var(--brl)}
.btn-comment-submit{background:var(--br);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;cursor:pointer}

/* SHARE LINK */
.share-link-box{background:var(--cr);border:0.5px solid var(--crd);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ts);font-family:monospace;word-break:break-all;margin-bottom:12px}

/* FORM */
.form-section{background:#fff;border:0.5px solid var(--crd);border-radius:12px;padding:22px}
.form-row{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:var(--ts);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;border:0.5px solid var(--crd);border-radius:8px;padding:9px 13px;font-size:14px;color:var(--tm);background:var(--cr);outline:none;font-family:inherit}
.form-input:focus{border-color:var(--brl)}
textarea.form-input{min-height:120px;resize:vertical}
.form-access-row{display:flex;gap:8px}
.access-opt{flex:1;border:0.5px solid var(--crd);border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-size:12px;color:var(--ts)}
.access-opt.selected{border-color:var(--br);background:var(--crm);color:var(--br);font-weight:600}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--cr);border-radius:8px;border:0.5px solid var(--crd)}
.toggle-label{font-size:13px;color:var(--tm);font-weight:500}
.toggle-sub{font-size:11px;color:var(--th);margin-top:2px}
.toggle-switch{width:38px;height:22px;background:var(--crd);border-radius:11px;cursor:pointer;position:relative;border:none;flex-shrink:0}
.toggle-switch.on{background:var(--br)}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .2s}
.toggle-switch.on::after{left:19px}
.upload-area{border:0.5px dashed var(--crd);border-radius:8px;padding:18px;text-align:center;color:var(--th);font-size:13px;cursor:pointer;background:var(--cr)}
.upload-area:hover{border-color:var(--brl)}
.btn-submit{background:var(--br);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer}
.btn-cancel-sm{background:none;border:0.5px solid var(--crd);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--ts);cursor:pointer}

/* STAFF */
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.staff-card{background:#fff;border:0.5px solid var(--crd);border-radius:12px;padding:14px;position:relative}
.staff-card.inactive{opacity:.55}
.staff-avatar{width:38px;height:38px;border-radius:50%;background:var(--crm);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--br);margin-bottom:9px}
.staff-name{font-size:13px;font-weight:600;color:var(--tm)}
.staff-store{font-size:11px;color:var(--ts);margin-bottom:5px}
.staff-role{font-size:10px;font-weight:700;border-radius:10px;padding:2px 7px;display:inline-block}
.role-admin{background:var(--br);color:#fff}
.role-manager{background:var(--gdl);color:var(--br)}
.role-barista{background:var(--crm);color:var(--brm)}
.role-pastry{background:#e8f4f0;color:#1a5c44}
.role-purchase{background:var(--blb);color:var(--bl)}
.role-hr{background:var(--pub);color:var(--pu)}
.staff-code{font-size:10px;color:var(--th);margin-top:5px;font-family:monospace}
.inactive-tag{position:absolute;top:9px;right:9px;font-size:9px;background:var(--rdb);color:var(--rd);border-radius:8px;padding:2px 6px;font-weight:700}
.active-dot{position:absolute;top:9px;right:9px;width:7px;height:7px;background:var(--gn);border-radius:50%}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat-card{background:var(--crm);border-radius:10px;padding:13px;text-align:center}
.stat-num{font-size:22px;font-weight:500;color:var(--br)}
.stat-lbl{font-size:11px;color:var(--ts);margin-top:2px}

/* NOTIFICATION SETTINGS */
.notif-card{background:#fff;border:0.5px solid var(--crd);border-radius:12px;padding:18px;margin-bottom:12px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--crd)}
.setting-row:last-child{border-bottom:none}
.setting-title{font-size:13px;color:var(--tm);font-weight:500}
.setting-sub{font-size:11px;color:var(--th);margin-top:2px}
.badge-free{background:var(--gnb);color:var(--gn);font-size:9px;font-weight:700;border-radius:8px;padding:2px 6px;margin-left:6px}
.badge-req{background:var(--crm);color:var(--ts);font-size:9px;border-radius:8px;padding:2px 6px;margin-left:6px}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(43,26,14,.5);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-inner{background:#fff;border-radius:14px;padding:24px;width:340px;max-width:90vw}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--tm)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn-sm{padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.btn-sm.primary{background:var(--br);color:#fff;border:none}
.btn-sm.ghost{background:none;border:0.5px solid var(--crd);color:var(--ts)}
.tag-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.tag-item{display:flex;align-items:center;gap:7px}
.tag-item input{flex:1;border:0.5px solid var(--crd);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;font-family:inherit}
.btn-add-tag{background:none;border:0.5px dashed var(--crd);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--ts);cursor:pointer;width:100%}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--th);font-size:14px;gap:10px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* NOTIF PANEL */
.notif-panel{display:none;position:fixed;top:58px;right:16px;background:#fff;border:0.5px solid var(--crd);border-radius:14px;padding:18px;width:300px;z-index:150;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.notif-panel.open{display:block}
.notif-item{padding:10px 0;border-bottom:0.5px solid var(--crd);cursor:pointer}
.notif-item:last-child{border-bottom:none}
.notif-item-title{font-size:13px;font-weight:500;color:var(--tm);margin-bottom:2px}
.notif-item-meta{font-size:11px;color:var(--th)}
.notif-dot-item{width:6px;height:6px;background:var(--gd);border-radius:50%;display:inline-block;margin-right:5px}

/* ADD USER FORM */
.add-user-form{background:#fff;border:0.5px solid var(--crd);border-radius:12px;padding:20px;margin-bottom:16px;display:none}
.add-user-form.open{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--crd)}
.setting-row:last-child{border-bottom:none}
.setting-title{font-size:13px;color:var(--tm);font-weight:500}
.setting-sub{font-size:11px;color:var(--th);margin-top:2px}
.notif-card{background:#fff;border:0.5px solid var(--crd);border-radius:12px;padding:18px;margin-bottom:12px}
@media(max-width:768px){
  #mainScreen{flex-direction:column}
  .sidebar{width:100%;min-height:auto;flex-direction:row;padding:0;border-right:none;border-bottom:0.5px solid var(--crd);overflow-x:auto;flex-shrink:0}
  .sidebar-section{display:flex;flex-direction:row;padding:0;margin-bottom:0;align-items:center}
  .sidebar-label{display:none}
  .nav-btn{padding:10px 8px;border-radius:0;font-size:12px;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
  .nav-btn.active{background:none;border-bottom-color:var(--br);color:var(--br)}
  .nav-btn i{display:none}
  .sidebar-footer{display:none}
  #adminNav{flex-direction:row}
  .content{padding:14px}
  .board-tabs{flex-wrap:nowrap;overflow-x:auto}
  .tab-btn{white-space:nowrap;flex-shrink:0}
}
</style>
</head>
<body>
<div id="app">

<!-- TOPBAR -->
<div class="topbar" id="topbar">
  <div class="logo" onclick="goPage('all')" style="cursor:pointer">Bonanza Coffee — 운영 매뉴얼</div>
  <div class="topbar-right">
    <button class="topbar-btn" onclick="toggleNotifPanel()" aria-label="알림">
      <i class="ti ti-bell"></i>
      <span class="notif-dot" id="notifDot"></span>
    </button>
    <div class="user-badge" id="userBadgeEl"></div>
    <button class="topbar-btn" onclick="doLogout()"><i class="ti ti-logout"></i> 로그아웃</button>
  </div>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Bonanza Coffee Korea</div>
    <div class="login-sub">운영 매뉴얼 시스템</div>
    <input type="text" id="loginCode" placeholder="직원 코드 (예: BCK-001)" />
    <input type="password" id="loginPw" placeholder="비밀번호" />
    <label class="autologin-row">
      <input type="checkbox" id="autoLogin" style="width:auto;margin:0"> 자동 로그인
    </label>
    <button class="btn-login" onclick="doLogin()">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- MAIN -->
<div id="mainScreen">
  <nav class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">게시판</div>
      <button class="nav-btn" onclick="goPage('all')" id="nav-all"><i class="ti ti-layout-list"></i> 전체보기</button>
      <div id="catNavArea"></div>
    </div>
    <div class="sidebar-section" id="adminNav" style="display:none">
      <div class="sidebar-label">관리</div>
      <button class="nav-btn" onclick="goPage('drafts')" id="nav-drafts"><i class="ti ti-notes"></i> 임시저장<span class="nav-new" id="draftBadge" style="display:none">!</span></button>
      <button class="nav-btn" onclick="goPage('staff')" id="nav-staff"><i class="ti ti-users"></i> 인원 현황</button>
      <button class="nav-btn" onclick="goPage('stats')" id="nav-stats"><i class="ti ti-chart-bar"></i> 공지 통계</button>
      <button class="nav-btn" onclick="goPage('notifsettings')" id="nav-ns"><i class="ti ti-bell"></i> 알림 설정</button>
      <button class="nav-btn" onclick="goPage('appsettings')" id="nav-app"><i class="ti ti-settings-2"></i> 앱 관리</button>
    </div>
    <div class="sidebar-footer" id="sidebarInfo" onclick="goPage('profile')" style="cursor:pointer;display:flex;align-items:center;gap:6px">
      <i class="ti ti-user-circle" style="font-size:16px;color:var(--th)"></i>

const roleLbl = {admin:'운영팀',manager:'매니저',barista:'바리스타',pastry:'파티쉐',purchase:'구매팀',hr:'인사팀'};

function toKST(s){if(!s)return '';return new Date(new Date(s).getTime()+9*3600000).toISOString();}
function fmtDate(s){if(!s)return '';return toKST(s).slice(0,10);}

// ── AUTH ──────────────────────────────────────────
async function doLogin() {
  const code = document.getElementById('loginCode').value.trim().toUpperCase();
  const pw = document.getElementById('loginPw').value.trim();
  const err = document.getElementById('loginErr');
  err.textContent = '확인 중...';

  const { data, error } = await sb.from('users')
    .select('*')
    .eq('code', code)
    .eq('password_hash', pw)
    .single();

  if (error || !data) { err.textContent = '직원 코드 또는 비밀번호를 확인해주세요.'; return; }
  if (!data.active) { err.textContent = '비활성화된 계정입니다. 운영팀에 문의해 주세요.'; return; }

  const today = new Date().toISOString().slice(0,10);
  if (data.retire_date && data.retire_date <= today) {
    await sb.from('users').update({active:false}).eq('id', data.id);
    err.textContent = '접근 권한이 만료된 계정입니다.'; return;
  }

  if (document.getElementById('autoLogin').checked) {
    try { localStorage.setItem('bck_auto', JSON.stringify({code, pw})); } catch(e) {}
  }
  loginAs(data);
}

function loginAs(user) {
  currentUser = user;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'flex';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('adminNav').style.display = (user.role === 'admin') ? '' : 'none';
  document.getElementById('sidebarInfoTxt').textContent = user.store + ' · ' + user.name;
  document.getElementById('userBadgeEl').innerHTML = `<span class="role-tag">${roleLbl[user.role]||user.role}</span>${user.store} ${user.name}`;
  loadCats();
  setInterval(checkScheduled, 60000);

  // check for deep-link post
  const params = new URLSearchParams(location.search);
  const postId = params.get('post');
  if (postId) openPostById(parseInt(postId));
}

async function doLogout() {
  try { localStorage.removeItem('bck_auto'); } catch(e) {}
  currentUser = null;
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginCode').value = '';
  document.getElementById('loginPw').value = '';
  document.getElementById('loginErr').textContent = '';
}

// ── CATEGORIES ────────────────────────────────────
async function loadCats() {
  const { data } = await sb.from('categories').select('*').order('sort_order');
  allCats = data || [];
  renderCatNav();
  goPage('all');
  updateNotifDot();
}

function renderCatNav() {
  const area = document.getElementById('catNavArea');
  area.innerHTML = allCats.map(c => {
    const ic = c.icon || 'ti-folder';
    return `<button class="nav-btn" onclick="switchCat(${c.id},'${c.name}')" id="nav-cat-${c.id}">
      <i class="ti ${ic}"></i> ${c.name}
      <span class="nav-new" id="newBadge-${c.id}" style="display:none">N</span>
    </button>`;
  }).join('');
  updateNotifDot();
}

async function updateNotifDot() {
  const dot = document.getElementById('notifDot');
  if (!dot) return;
  const week = new Date(Date.now() - 7*864e5).toISOString();
  const {data:posts} = await sb.from('posts').select('id,category_id').gte('created_at',week).eq('status','published');
  if (!posts) return;
  const {data:myReads} = await sb.from('post_reads').select('post_id').eq('user_id',currentUser.id);
  const readIds = new Set((myReads||[]).map(r=>r.post_id));
  const unread = posts.filter(p=>!readIds.has(p.id));
  dot.style.display = unread.length ? 'inline-block' : 'none';
  allCats.forEach(c => {
    const badge = document.getElementById('newBadge-'+c.id);
    if (badge) badge.style.display = unread.some(p=>p.category_id===c.id) ? '' : 'none';
  });
}
async function updateDraftBadge(){
  const b = document.getElementById('draftBadge');
  if (!b||!currentUser) return;
  const {data} = await sb.from('posts').select('id').in('status',['draft','scheduled']).eq('author_id',currentUser.id);
  b.style.display = (data&&data.length) ? '' : 'none';
}
async function checkScheduled(){
  if (!currentUser||currentUser.role!=='admin') return;
  const now = new Date().toISOString();
  const {data} = await sb.from('posts').select('id').eq('status','scheduled').lte('scheduled_at',now);
  if (data&&data.length) {
    for (const p of data) await sb.from('posts').update({status:'published',created_at:now}).eq('id',p.id);
    updateNotifDot();
  }
}

function switchCat(id, name) {
  currentCatId = id;
  currentCatName = name;
  goPage('board');
}

function canSee(post) {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  if (post.status && post.status !== 'published') return false;
  const cat = allCats.find(c => c.id === post.category_id);
  if (cat) {
    if (cat.name === '구매팀' && currentUser.role !== 'purchase') return false;
    if (cat.name === '인사팀' && currentUser.role !== 'hr') return false;
  }
  if (post.access === 'manager' && currentUser.role === 'barista') return false;
  if (post.access === 'manager' && currentUser.role === 'pastry') return false;
  return true;
}

function canWrite() {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  const cat = allCats.find(c => c.id === currentCatId);
  if (!cat) return false;
  if (cat.name === '구매팀' && currentUser.role === 'purchase') return true;
  if (cat.name === '인사팀' && currentUser.role === 'hr') return true;
  return false;
}

// ── PAGES ─────────────────────────────────────────
function goPage(page) {
  currentPage = page;
  const area = document.getElementById('contentArea');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  if (page === 'board') {
    const nb = document.getElementById('nav-cat-'+currentCatId);
    if (nb) nb.classList.add('active');
    renderBoard(area);
  } else if (page === 'postdetail') {
    renderPostDetail(area);
  } else if (page === 'newpost') {
    renderNewPost(area);
  } else if (page === 'staff') {
    document.getElementById('nav-staff').classList.add('active');
    renderStaff(area);
  } else if (page === 'stats') {
    document.getElementById('nav-stats').classList.add('active');
    renderStats(area);
  } else if (page === 'notifsettings') {
    document.getElementById('nav-ns').classList.add('active');
    renderNotifSettings(area);
  } else if (page === 'all') {
    const nb = document.getElementById('nav-all');
    if (nb) nb.classList.add('active');
    renderAll(area);
  } else if (page === 'drafts') {
    const nb = document.getElementById('nav-drafts');
    if (nb) nb.classList.add('active');
    renderDrafts(area);
  } else if (page === 'appsettings') {
    const nb = document.getElementById('nav-app');
    if (nb) nb.classList.add('active');
    renderAppSettings(area);
  } else if (page === 'profile') {
    renderProfile(area);
  } else if (page === 'editpost') {
    renderEditPost(area);
  }
}

// ── BOARD ─────────────────────────────────────────
async function renderBoard(area) {
  area.innerHTML = `<div class="loading"><i class="ti ti-loader spin"></i> 불러오는 중...</div>`;
  const { data: posts } = await sb.from('posts')
    .select('*, categories(name), users(name,store)')
    .eq('category_id', currentCatId)
    .order('created_at', {ascending: false});

  const q = (document.getElementById('boardSearch')?.value || '').toLowerCase();
  const filtered = (posts || []).filter(p => canSee(p) && (!q || p.title.toLowerCase().includes(q) || p.body.toLowerCase().includes(q)));
  const week = new Date(Date.now() - 7*24*60*60*1000).toISOString();

  const catTabs = allCats.map(c =>
    `<button class="tab-btn${c.id===currentCatId?' active':''}" onclick="switchCat(${c.id},'${c.name}')">${c.name}</button>`
  ).join('');
  const adminBtn = currentUser.role==='admin' ? `<button class="tab-manage" onclick="openCatModal()"><i class="ti ti-settings"></i> 카테고리 관리</button>` : '';
  const newBtn = canWrite() ? `<button class="btn-new" onclick="goPage('newpost')"><i class="ti ti-plus"></i> 새 공지</button>` : '';

  // get comment counts
  const postIds = filtered.map(p=>p.id);
  let cmtCounts = {};
  if (postIds.length > 0) {
    const { data: cmts } = await sb.from('comments').select('post_id').in('post_id', postIds);
    (cmts||[]).forEach(c => { cmtCounts[c.post_id] = (cmtCounts[c.post_id]||0)+1; });
  }

  const postHtml = filtered.length ? filtered.map(p => {
    const isNew = new Date(p.created_at) >= new Date(week);
    const accLbl = p.access==='all'?'전 직원':'매니저 이상';
    const accCls = p.access==='all'?'all':'';
    const cc = cmtCounts[p.id]||0;
    return `<div class="post-card" onclick="openPostById(${p.id})">
      <div class="post-card-top">
        <span class="post-title-txt">${p.title}</span>
        ${isNew?'<span class="badge-new">NEW</span>':''}
        <span class="badge-access ${accCls}">${accLbl}</span>
        ${p.comments_on?`<span class="badge-comment"><i class="ti ti-message-2"></i> ${cc}</span>`:''}
      </div>
      <div class="post-meta">
        <span>${fmtDate(p.created_at)}</span>
        ${['admin','purchase','hr'].includes(currentUser.role)?`<span class="read-rate" id="rate-${p.id}">확인률 로드중...</span>`:''}
      </div>
    </div>`;
  }).join('') : `<div style="text-align:center;padding:40px;color:var(--th);font-size:14px">등록된 공지가 없습니다.</div>`;

  area.innerHTML = `
    <div class="page-header"><div class="page-title">운영 매뉴얼</div><div class="page-sub">매장 운영 기준 및 공지 열람</div></div>
    <div class="board-tabs">${catTabs}${adminBtn}</div>
    <div class="board-toolbar">
      <div class="search-box"><i class="ti ti-search" style="color:var(--th)"></i><input id="boardSearch" placeholder="공지 검색..." oninput="renderBoard(document.getElementById('contentArea'))" /></div>
      ${newBtn}
    </div>
    <div class="post-list">${postHtml}</div>`;

  // load read rates async
  if (['admin','purchase','hr'].includes(currentUser.role) && filtered.length > 0) {
    const { data: activeUsers } = await sb.from('users').select('id').eq('active', true).neq('role','admin');
    const total = (activeUsers||[]).length;
    const { data: reads } = await sb.from('post_reads').select('post_id').in('post_id', postIds);
    let readsByPost = {};
    (reads||[]).forEach(r => { readsByPost[r.post_id] = (readsByPost[r.post_id]||0)+1; });
    filtered.forEach(p => {
      const el = document.getElementById('rate-'+p.id);
      if (el) {
        const rate = total > 0 ? Math.round((readsByPost[p.id]||0)/total*100) : 0;
        el.textContent = `확인 ${rate}%`;
      }
    });
  }
}

// ── POST DETAIL ───────────────────────────────────
async function openPostById(id) {
  const { data } = await sb.from('posts').select('*, categories(name), users(name,store)').eq('id',id).single();
  if (!data || !canSee(data)) return;
  currentPost = data;
  goPage('postdetail');
}

async function renderPostDetail(area) {
  const p = currentPost;
  if (!p) { goPage('board'); return; }
  area.innerHTML = `<div class="loading"><i class="ti ti-loader spin"></i> 불러오는 중...</div>`;

  const week = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  const isNew = new Date(p.created_at) >= new Date(week);
  const isAdmin = currentUser.role === 'admin';
  const isDeptWriter = canWrite();

  // load reads, comments, attachments
  const [readsRes, cmtsRes, attRes] = await Promise.all([
    sb.from('post_reads').select('*, users(name,store)').eq('post_id', p.id),
    sb.from('comments').select('*, users(name,store,nickname,avatar_url)').eq('post_id', p.id).order('created_at'),
    sb.from('attachments').select('*').eq('post_id', p.id)
  ]);
  const reads = readsRes.data || [];
  const comments = cmtsRes.data || [];
  const attachments = attRes.data || [];

  // active non-admin user count for reach
  const { data: activeUsers } = await sb.from('users').select('id').eq('active',true).neq('role','admin');
  const total = (activeUsers||[]).length;
  const rate = total > 0 ? Math.round(reads.length/total*100) : 0;

  const myRead = reads.find(r => r.user_id === currentUser.id);
  const wmText = `${currentUser.code} ${currentUser.name} ${currentUser.store}`;
  const accLbl = p.access==='all'?'전 직원':'매니저 이상';

  let confirmHtml = '';
  if (!isAdmin) {
    if (myRead) {
      confirmHtml = `<div class="confirm-section"><button class="btn-confirm done" disabled><i class="ti ti-check"></i> 확인 완료</button><div class="confirm-time">확인 일시: ${fmtDate(myRead.read_at)} ${myRead.read_at?.slice(11,16)||''}</div></div>`;
    } else {
      confirmHtml = `<div class="confirm-section"><button class="btn-confirm" onclick="confirmRead(${p.id})"><i class="ti ti-check"></i> 확인했습니다</button></div>`;
    }
  }

  let readListHtml = '';
  if (isAdmin || isDeptWriter) {
    readListHtml = `<div style="margin-bottom:16px">
      <div class="section-label">직원별 확인 현황</div>
      <div class="reach-bar"><div class="reach-fill" style="width:${rate}%"></div></div>
      <div class="reach-label"><span>전체 도달률 ${rate}%</span><span>${reads.length}/${total}명</span></div>
      <div style="margin-top:8px">
        ${reads.map(r=>`<div class="read-row"><div><span style="font-weight:600;font-size:12px">${r.users?.name||''}</span> <span style="color:var(--th);font-size:11px">${r.users?.store||''}</span></div><span style="color:var(--th);font-size:11px">${r.read_at?.slice(0,16).replace('T',' ')||''}</span></div>`).join('')}
        ${total-reads.length>0?`<div class="read-row"><span class="unread-badge">미확인 ${total-reads.length}명</span></div>`:''}
      </div>
    </div>`;
  }

  const iconMap2 = {pdf:'ti-file-type-pdf',doc:'ti-file-type-doc',docx:'ti-file-type-doc',xls:'ti-file-type-xls',xlsx:'ti-file-type-xls',jpg:'ti-photo',jpeg:'ti-photo',png:'ti-photo',gif:'ti-photo'};
  let attachHtml = '';
  if (attachments.length) {
    const attLinks = attachments.map(a => {
      const ext = (a.file_name||'').split('.').pop().toLowerCase();
      const ico = iconMap2[ext] || 'ti-paperclip';
      return `<a href="${a.file_url}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:0.5px solid var(--crd);border-radius:8px;text-decoration:none;margin-bottom:6px;color:var(--bl)">
        <i class="ti ${ico}" style="font-size:20px;flex-shrink:0"></i>
        <span style="flex:1;font-size:13px;text-decoration:underline;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.file_name}</span>
        <span style="font-size:10px;font-weight:700;background:var(--blb);border-radius:4px;padding:2px 6px;flex-shrink:0">${ext.toUpperCase()}</span>
        <i class="ti ti-download" style="font-size:14px;color:var(--th);flex-shrink:0"></i>
      </a>`;
    }).join('');
    attachHtml = `<div style="margin-bottom:16px"><div class="attach-label">첨부파일 (${attachments.length}개)</div><div style="margin-top:8px">${attLinks}</div></div>`;
  }

  let cmtHtml = '';
  if (p.comments_on) {
    const cmtItems = comments.map(c => {
      const isMine = c.author_id === currentUser.id;
      const isAdminUser = currentUser.role === 'admin';
      const dispName = c.users?.nickname || c.users?.name || '?';
      const avatarContent = c.users?.avatar_url
        ? `<img src="${c.users.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`

      return `<div class="comment-item" id="cmt-${c.id}">
        <div class="comment-head">
          <div class="comment-avatar" style="overflow:hidden">${avatarContent}</div>
          <span style="font-size:12px;font-weight:600;color:var(--tm)">${dispName}</span>
          <span style="font-size:11px;color:var(--th);margin-left:4px">${c.users?.store||''}</span>
          <span style="font-size:11px;color:var(--th);margin-left:auto">${fmtDateTime(c.created_at)}</span>
          ${isMine ? `<button onclick="editCmt(${c.id})" style="background:none;border:none;color:var(--th);cursor:pointer;font-size:12px;margin-left:6px"><i class="ti ti-edit"></i></button>` : ''}
          ${(isMine||isAdminUser) ? `<button onclick="delCmt(${c.id},${p.id})" style="background:none;border:none;color:var(--th);cursor:pointer;font-size:12px;margin-left:2px"><i class="ti ti-trash"></i></button>` : ''}

    }).join('');
    cmtHtml = `<div class="comment-section">
      <div class="section-label">댓글 ${comments.length}개</div>
      ${cmtItems}
      <div class="comment-input-row">
        <textarea id="cmtInput" placeholder="의견이나 질문을 남겨주세요..."></textarea>
        <button class="btn-comment-submit" onclick="submitComment(${p.id})">등록</button>
      </div>
    </div>`;
  }

  const catNameForEdit = allCats.find(c=>c.id===p.category_id)?.name||'';
  const editBtn = canWrite() ? `<button class="btn-cancel-sm" style="font-size:12px;padding:5px 10px" onclick="openEditPost(${p.id})"><i class="ti ti-edit"></i> 수정</button>` : '';

  area.innerHTML = `
    <div style="margin-bottom:10px"><button class="btn-cancel-sm" onclick="goPage('board')"><i class="ti ti-arrow-left"></i> 목록</button></div>
    <div class="post-detail">
      <div class="detail-header">
        <div class="detail-title-row">${isNew?'<span class="badge-new">NEW</span>':''} ${p.title}</div>
        <div class="detail-meta">
          <span>${fmtDate(p.created_at)}</span>
          <span>${p.categories?.name||''}</span>
          <span>열람: ${accLbl}</span>
          <span style="margin-left:auto;display:flex;gap:8px">
            ${editBtn}
            <button class="btn-cancel-sm" style="font-size:12px;padding:5px 10px" onclick="openShareModal(${p.id})"><i class="ti ti-share"></i> 링크 공유</button>

async function submitPost() {

  const body = document.getElementById('nBody').value.trim();
  const catId = parseInt(document.getElementById('nCat').value);

    category_id: catId,
    title, body,

    comments_on: commentsOn,
    author_id: currentUser.id
  }).select().single();

  if (error) { alert('등록 오류: ' + error.message); return; }

  goPage('board');
}

async function renderStats(area) {
  area.innerHTML = `<div class="loading"><i class="ti ti-loader spin"></i> 불러오는 중...</div>`;
  const { data: posts } = await sb.from('posts').select('id,title,category_id,created_at,categories(name)').order('created_at',{ascending:false});
  const { data: reads } = await sb.from('post_reads').select('post_id');
  const { data: activeUsers } = await sb.from('users').select('id').eq('active',true).neq('role','admin');

  const total = (activeUsers||[]).length;
  let readsByPost = {};
  (reads||[]).forEach(r => { readsByPost[r.post_id] = (readsByPost[r.post_id]||0)+1; });

  const allReads = Object.values(readsByPost).reduce((a,b)=>a+b,0);
  const allPossible = (posts||[]).length * total;
  const avg = allPossible > 0 ? Math.round(allReads/allPossible*100) : 0;

  const cards = (posts||[]).map(p => {
    const r = readsByPost[p.id]||0;
    const rate = total>0?Math.round(r/total*100):0;
    return `<div class="post-card" style="cursor:default">
      <div class="post-card-top"><span class="post-title-txt" style="font-size:13px">${p.title}</span>
        <span class="badge-new" style="background:var(--crm);color:var(--ts)">${p.categories?.name||''}</span>
      </div>
      <div style="margin:6px 0"><div class="reach-bar"><div class="reach-fill" style="width:${rate}%"></div></div></div>
      <div class="reach-label"><span>${r}/${total}명 확인</span><span class="read-rate">${rate}%</span></div>
    </div>`;
  }).join('');

  area.innerHTML = `
    <div class="page-header"><div class="page-title">공지 통계</div><div class="page-sub">전체 공지 도달률 현황</div></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${(posts||[]).length}</div><div class="stat-lbl">전체 공지</div></div>
      <div class="stat-card"><div class="stat-num">${avg}%</div><div class="stat-lbl">평균 도달률</div></div>
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-lbl">활성 직원</div></div>
    </div>
    <div class="post-list">${cards}</div>`;
}

async function deleteCat(id) {
  const {data:posts} = await sb.from('posts').select('id').eq('category_id',id);
  const msg = posts&&posts.length>0 ? `게시글 ${posts.length}개가 있습니다. 함께 삭제할까요?` : '카테고리를 삭제할까요?';
  if (!confirm(msg)) return;
  if (posts&&posts.length>0) await sb.from('posts').delete().eq('category_id',id);
  await sb.from('categories').delete().eq('id',id);
  closeCatModal();
  await loadCats();
}
async function saveCats() {
  const nameInputs = document.querySelectorAll('[id^="cat-f-"]');
  const iconInputs = document.querySelectorAll('[id^="ci-"]');
  for (let i=0; i<nameInputs.length; i++) {
    const name = nameInputs[i].value.trim();
    if (!name) continue;
    const id = nameInputs[i].dataset.id;
    const icon = iconInputs[i] ? iconInputs[i].value : 'ti-folder';
    if (id) await sb.from('categories').update({name,icon,sort_order:i+1}).eq('id',parseInt(id));
    else await sb.from('categories').insert({name,icon,sort_order:i+1});
  }
  closeCatModal();
  await loadCats();
}

      <div class="form-row"><div class="toggle-row"><div><div class="toggle-label">댓글 허용</div></div>
        <button class="toggle-switch${p.comments_on?' on':''}" id="eCmtToggle" onclick="this.classList.toggle('on')"></button>
      </div></div>
      ${atts&&atts.length ? `<div class="form-row"><label class="form-label">기존 첨부파일</label>${atts.map(a=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--crd)"><i class="ti ti-paperclip" style="color:var(--bl)"></i><span style="flex:1;font-size:13px;color:var(--bl)">${a.file_name}</span><button onclick="delAttachment(${a.id},this)" style="background:none;border:none;color:var(--rd);cursor:pointer"><i class="ti ti-trash"></i></button></div>`).join('')}</div>` : ''}

    document.getElementById('eacc-mgr').className = 'access-opt'+(v==='manager'?' selected':'');
  };
  window.updatePost = async function(id){
    const title = document.getElementById('eTitle').value.trim();
    const body = editQuill ? editQuill.root.innerHTML : '';
    const catId = parseInt(document.getElementById('eCat').value);
    const commentsOn = document.getElementById('eCmtToggle').classList.contains('on');
    if (!title) { alert('제목을 입력해주세요.'); return; }
    await sb.from('posts').update({title,body,category_id:catId,access:editAccess,comments_on:commentsOn,updated_at:new Date().toISOString()}).eq('id',id);
    currentCatId = catId;
    goPage('board');
  };
  window.delAttachment = async function(attId, btn){
    await sb.from('attachments').delete().eq('id',attId);
    btn.closest('div').remove();
  };

  let editQuill = null;
  function initEditQuill(){
    if (typeof Quill==='undefined'){setTimeout(initEditQuill,200);return;}
    const el = document.getElementById('eEditor');
    if(!el||el.classList.contains('ql-container')) return;
    editQuill = new Quill('#eEditor',{theme:'snow',modules:{toolbar:[[{header:[1,2,3,false]}],['bold','italic','underline'],[{list:'ordered'},{list:'bullet'}],['link','image'],['clean']]},placeholder:'내용을 입력하세요...'});
    if (p.body) editQuill.root.innerHTML = p.body;
  }
  setTimeout(initEditQuill, 150);
}

async function delCmt(cmtId, postId){
  if (!confirm('댓글을 삭제할까요?')) return;
  await sb.from('comments').delete().eq('id',cmtId);
  openPostById(postId);
}
function editCmt(cmtId){
  const bodyEl = document.getElementById('cbody-'+cmtId);
  if(!bodyEl) return;
  const cur = bodyEl.textContent;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:6px;margin-top:4px';
  const ta = document.createElement('textarea');
  ta.id = 'cedit-'+cmtId;
  ta.value = cur;
  ta.style.cssText = 'flex:1;border:0.5px solid var(--crd);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:none;min-height:60px;outline:none';
  const btnWrap = document.createElement('div');
  btnWrap.style.cssText = 'display:flex;flex-direction:column;gap:4px';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn-comment-submit';
  saveBtn.style.cssText = 'padding:6px 10px;font-size:12px';
  saveBtn.textContent = '저장';
  saveBtn.onclick = async function(){
    const newBody = ta.value.trim();
    if(!newBody) return;
    await sb.from('comments').update({body:newBody}).eq('id',cmtId);
    bodyEl.innerHTML = newBody;
    bodyEl.parentNode.replaceChild(bodyEl, bodyEl);
  };
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn-cancel-sm';
  cancelBtn.style.cssText = 'padding:6px 10px;font-size:12px';
  cancelBtn.textContent = '취소';
  cancelBtn.onclick = function(){ bodyEl.innerHTML = cur; };
  btnWrap.appendChild(saveBtn);
  btnWrap.appendChild(cancelBtn);
  wrap.appendChild(ta);
  wrap.appendChild(btnWrap);
  bodyEl.innerHTML = '';
  bodyEl.appendChild(wrap);
}

const CAT_COLORS = [
  ['#E8F0FE','#1A4B7A'],['#EAF4EE','#2D6A4F'],['#FFF3E0','#B85C00'],
  ['#EEEDFE','#534AB7'],['#FAF0EE','#A0291E'],['#EDE4D6','#6B3E2A'],
  ['#E8F4F0','#1A5C44'],['#FEF3F8','#A0297A']
];
async function renderAll(area) {
  area.innerHTML = '<div class="loading"><i class="ti ti-loader spin"></i> 불러오는 중...</div>';
  let q = sb.from('posts').select('*,categories(name)').order('created_at',{ascending:false});
  if (currentUser.role !== 'admin') q = q.eq('status','published');
  const {data:posts} = await q;
  const filtered = (posts||[]).filter(p=>canSee(p));
  const week = new Date(Date.now()-7*864e5).toISOString();
  const tabs = allCats.map(c =>
    `<button class="tab-btn" onclick="switchCat(${c.id},'${c.name}')">${c.name}</button>`
  ).join('');
  const adminBtn = currentUser.role==='admin' ? `<button class="tab-manage" onclick="openCatModal()"><i class="ti ti-settings"></i> 카테고리 관리</button>` : '';
  const newBtn = canWrite() ? `<button class="btn-new" onclick="goPage('newpost')"><i class="ti ti-plus"></i> 새 공지</button>` : '';
  const postHtml = filtered.map(p => {
    const isNew = new Date(p.created_at) >= new Date(week);
    const catIdx = allCats.findIndex(c=>c.id===p.category_id);
    const cc = CAT_COLORS[catIdx>=0 ? catIdx%CAT_COLORS.length : 0];
    const catName = p.categories?.name || '';
    return `<div class="post-card" onclick="openPostById(${p.id})">
      <div class="post-card-top">
        <span class="post-title-txt">${p.title}</span>
        ${isNew ? '<span class="badge-new">NEW</span>' : ''}
        <span style="font-size:9px;font-weight:700;border-radius:10px;padding:2px 8px;background:${cc[0]};color:${cc[1]}">${catName}</span>
      </div>
      <div class="post-meta"><span>${fmtDate(p.created_at)}</span></div>
    </div>`;
  }).join('') || '<div style="text-align:center;padding:40px;color:var(--th)">등록된 공지가 없습니다.</div>';
  area.innerHTML = `
    <div class="page-header"><div class="page-title">전체보기</div><div class="page-sub">모든 게시판 공지 최신순</div></div>

    <div class="board-toolbar">
      <div class="search-box"><i class="ti ti-search" style="color:var(--th)"></i><input id="allSearch" placeholder="제목·본문 검색..." onkeydown="if(event.key==='Enter')doSearchAll()"/>
      <button onclick="doSearchAll()" style="background:var(--br);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer">검색</button></div>
      ${newBtn}
    </div>
    <div class="post-list" id="allPostList">${postHtml}</div>`;
}
async function doSearchAll(){
  const q = (document.getElementById('allSearch')?.value||'').trim().toLowerCase();
  if (!q) { renderAll(document.getElementById('contentArea')); return; }
  let query = sb.from('posts').select('*,categories(name)').order('created_at',{ascending:false});
  if (currentUser.role !== 'admin') query = query.eq('status','published');
  const {data:posts} = await query;
  const filtered = (posts||[]).filter(p=>canSee(p)&&(p.title?.toLowerCase().includes(q)||p.body?.toLowerCase().includes(q)));
  const week = new Date(Date.now()-7*864e5).toISOString();
  const pl = document.getElementById('allPostList');
  if (pl) pl.innerHTML = filtered.map(p => {
    const isNew = new Date(p.created_at) >= new Date(week);
    const catIdx = allCats.findIndex(c=>c.id===p.category_id);
    const cc = CAT_COLORS[catIdx>=0?catIdx%CAT_COLORS.length:0];
    return `<div class="post-card" onclick="openPostById(${p.id})">
      <div class="post-card-top"><span class="post-title-txt">${p.title}</span>
        ${isNew ? '<span class="badge-new">NEW</span>' : ''}
        <span style="font-size:9px;font-weight:700;border-radius:10px;padding:2px 8px;background:${cc[0]};color:${cc[1]}">${p.categories?.name||''}</span>
      </div><div class="post-meta"><span>${fmtDate(p.created_at)}</span></div>
    </div>`;
  }).join('') || '<div style="text-align:center;padding:40px;color:var(--th)">검색 결과가 없습니다.</div>';
}

async function uploadAvatar(input){
  const file = input.files[0]; if(!file) return;
  const ext = file.name.split('.').pop();
  const fname = `avatars/${currentUser.id}.${ext}`;
  const STURL = SUPABASE_URL+'/storage/v1/object/public/attachments/';
  const {error} = await sb.storage.from('attachments').upload(fname,file,{upsert:true});
  if(error){alert('업로드 오류: '+error.message);return;}
  const url = STURL+fname+'?t='+Date.now();
  await sb.from('users').update({avatar_url:url}).eq('id',currentUser.id);
  currentUser.avatar_url = url;
  renderProfile(document.getElementById('contentArea'));
}
async function saveProfile(){
  const store = document.getElementById('p_store').value;
  const phone = document.getElementById('p_phone').value.trim();
  const email = document.getElementById('p_email').value.trim();
  const nickname = document.getElementById('p_nick')?.value.trim();
  const cur = document.getElementById('p_cur').value;
  const pw = document.getElementById('p_new').value;
  const con = document.getElementById('p_con').value;
  const updates = {store, phone:phone||null, email:email||null, nickname:nickname||null};
  if(cur||pw||con){
    if(cur!==currentUser.password_hash){alert('현재 비밀번호가 맞지 않습니다.');return;}
    if(pw.length<4){alert('새 비밀번호는 4자 이상이어야 합니다.');return;}
    if(pw!==con){alert('새 비밀번호가 일치하지 않습니다.');return;}
    updates.password_hash = pw;
  }
  const {error} = await sb.from('users').update(updates).eq('id',currentUser.id);
  if(error){alert('저장 오류: '+error.message);return;}
  Object.assign(currentUser, updates);
  document.getElementById('sidebarInfoTxt').textContent = currentUser.store+' · '+currentUser.name;
  alert('저장되었습니다.');
}

function canWriteCat(catName){
  if(!currentUser) return false;
  if(currentUser.role==='admin') return true;
  if(catName==='구매팀'&&currentUser.role==='purchase') return true;
  if(catName==='인사팀'&&currentUser.role==='hr') return true;
  return false;
}

// ── CSS (추가분) ─────────────────────────────────────────────────
// ── INIT ──────────────────────────────────────────
document.addEventListener('click', e => {
  const panel = document.getElementById('notifPanel');
  if (panel?.classList.contains('open') && !panel.contains(e.target) && !e.target.closest('.topbar-btn')) {
    panel.classList.remove('open');
  }
});

try {
  const saved = JSON.parse(localStorage.getItem('bck_auto')||'null');
  if (saved) {
    sb.from('users').select('*').eq('code',saved.code).eq('password_hash',saved.pw).eq('active',true).single()
      .then(({data}) => { if(data) loginAs(data); });
  }
} catch(e) {}
</script>
</body>
